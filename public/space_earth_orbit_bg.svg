<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Deep Space Sky Gradient -->
    <radialGradient id="deepCosmos" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#070E22" />
      <stop offset="40%" stop-color="#040816" />
      <stop offset="80%" stop-color="#02040B" />
      <stop offset="100%" stop-color="#010206" />
    </radialGradient>

    <!-- Cosmic Nebula Glow 1 -->
    <radialGradient id="nebulaCyan" cx="75%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.14" />
      <stop offset="40%" stop-color="#0066FF" stop-opacity="0.08" />
      <stop offset="80%" stop-color="#0A1128" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Cosmic Nebula Glow 2 (Purple Deep Field) -->
    <radialGradient id="nebulaPurple" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.10" />
      <stop offset="50%" stop-color="#2E0854" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Earth Curvature Atmosphere Glow -->
    <radialGradient id="atmosphereGlow" cx="50%" cy="130%" r="70%">
      <stop offset="0%" stop-color="#02071A" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#03112E" stop-opacity="0.85" />
      <stop offset="68%" stop-color="#0055FF" stop-opacity="0.45" />
      <stop offset="72%" stop-color="#00E5FF" stop-opacity="0.75" />
      <stop offset="74%" stop-color="#80F5FF" stop-opacity="0.9" />
      <stop offset="76%" stop-color="#0066FF" stop-opacity="0.3" />
      <stop offset="82%" stop-color="#002266" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Earth Limb Edge Filter -->
    <linearGradient id="horizonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055FF" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E0FBFF" stop-opacity="1" />
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0055FF" stop-opacity="0.2" />
    </linearGradient>

    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmos Base -->
  <rect width="1920" height="1080" fill="url(#deepCosmos)" />

  <!-- Nebulae -->
  <rect width="1920" height="1080" fill="url(#nebulaCyan)" />
  <rect width="1920" height="1080" fill="url(#nebulaPurple)" />

  <!-- Distant Stars Field (Clusters and Single Stars) -->
  <g fill="#FFFFFF">
    <!-- Bright Key Stars with Glow -->
    <circle cx="240" cy="120" r="2.2" fill="#80E5FF" filter="url(#starGlow)" opacity="0.95" />
    <circle cx="480" cy="220" r="2.5" fill="#FFFFFF" filter="url(#starGlow)" opacity="1" />
    <circle cx="720" cy="90" r="1.8" fill="#FFF5D0" opacity="0.9" />
    <circle cx="1120" cy="180" r="2.4" fill="#60D5FF" filter="url(#starGlow)" opacity="0.9" />
    <circle cx="1450" cy="110" r="2.6" fill="#FFFFFF" filter="url(#starGlow)" opacity="1" />
    <circle cx="1680" cy="260" r="1.9" fill="#90E0EF" opacity="0.85" />
    <circle cx="1820" cy="140" r="2.2" fill="#FFFFFF" opacity="0.9" />
    <circle cx="960" cy="60" r="2.8" fill="#DDF4FF" filter="url(#starGlow)" opacity="1" />

    <!-- Ambient Stellar Field -->
    <circle cx="85" cy="85" r="1" opacity="0.6" />
    <circle cx="140" cy="340" r="0.8" opacity="0.5" />
    <circle cx="210" cy="460" r="1.2" opacity="0.7" />
    <circle cx="310" cy="180" r="1" opacity="0.65" />
    <circle cx="390" cy="80" r="1.4" opacity="0.8" />
    <circle cx="450" cy="420" r="0.9" opacity="0.55" />
    <circle cx="560" cy="150" r="1.2" opacity="0.75" />
    <circle cx="630" cy="320" r="0.8" opacity="0.4" />
    <circle cx="680" cy="260" r="1.1" opacity="0.7" />
    <circle cx="790" cy="180" r="1.3" opacity="0.85" />
    <circle cx="840" cy="410" r="0.7" opacity="0.45" />
    <circle cx="890" cy="240" r="1" opacity="0.6" />
    <circle cx="1020" cy="110" r="1.2" opacity="0.7" />
    <circle cx="1080" cy="330" r="0.8" opacity="0.5" />
    <circle cx="1180" cy="90" r="1.1" opacity="0.65" />
    <circle cx="1240" cy="270" r="1" opacity="0.6" />
    <circle cx="1320" cy="190" r="1.4" opacity="0.8" />
    <circle cx="1380" cy="400" r="0.7" opacity="0.4" />
    <circle cx="1520" cy="180" r="1.2" opacity="0.7" />
    <circle cx="1580" cy="90" r="1" opacity="0.6" />
    <circle cx="1640" cy="340" r="0.8" opacity="0.5" />
    <circle cx="1740" cy="190" r="1.3" opacity="0.75" />
    <circle cx="1790" cy="380" r="0.9" opacity="0.6" />
    <circle cx="1880" cy="290" r="1.1" opacity="0.7" />
    <circle cx="1900" cy="80" r="0.8" opacity="0.45" />

    <!-- Additional Micro Stars for Density -->
    <circle cx="50" cy="220" r="0.6" opacity="0.35" />
    <circle cx="170" cy="140" r="0.6" opacity="0.4" />
    <circle cx="290" cy="290" r="0.6" opacity="0.3" />
    <circle cx="360" cy="510" r="0.6" opacity="0.35" />
    <circle cx="520" cy="280" r="0.6" opacity="0.45" />
    <circle cx="610" cy="110" r="0.6" opacity="0.4" />
    <circle cx="740" cy="370" r="0.6" opacity="0.3" />
    <circle cx="860" cy="140" r="0.6" opacity="0.4" />
    <circle cx="930" cy="310" r="0.6" opacity="0.35" />
    <circle cx="1040" cy="210" r="0.6" opacity="0.45" />
    <circle cx="1150" cy="420" r="0.6" opacity="0.3" />
    <circle cx="1290" cy="130" r="0.6" opacity="0.4" />
    <circle cx="1410" cy="260" r="0.6" opacity="0.35" />
    <circle cx="1490" cy="460" r="0.6" opacity="0.3" />
    <circle cx="1620" cy="160" r="0.6" opacity="0.4" />
    <circle cx="1710" cy="310" r="0.6" opacity="0.35" />
    <circle cx="1840" cy="450" r="0.6" opacity="0.3" />
  </g>

  <!-- Distant Constellation Line Trace (Orion/Cassiopeia style subtle aerospace grid) -->
  <g stroke="#00E5FF" stroke-width="0.6" stroke-opacity="0.18" stroke-dasharray="2 3">
    <line x1="240" y1="120" x2="310" y2="180" />
    <line x1="310" y1="180" x2="390" y2="80" />
    <line x1="390" y1="80" x2="480" y2="220" />
    <line x1="1320" y1="190" x2="1450" y2="110" />
    <line x1="1450" y1="110" x2="1520" y2="180" />
    <line x1="1520" y1="180" x2="1680" y2="260" />
  </g>

  <!-- Earth Curvature & Atmospheric Thin Blue Limb -->
  <path d="M-200,1180 Q960,680 2120,1180 L2120,1300 L-200,1300 Z" fill="url(#atmosphereGlow)" />

  <!-- Thin Sharp Cyan/White Atmospheric Horizon Line -->
  <path d="M-200,1180 Q960,680 2120,1180" fill="none" stroke="url(#horizonLine)" stroke-width="2.2" opacity="0.95" />
  <path d="M-200,1180 Q960,680 2120,1180" fill="none" stroke="#00E5FF" stroke-width="6" opacity="0.25" />
  <path d="M-200,1180 Q960,680 2120,1180" fill="none" stroke="#0066FF" stroke-width="16" opacity="0.15" />

  <!-- Earth Night Surface City Light Clusters (Golden/Amber fibers under cloud veil) -->
  <g fill="#FFD166" opacity="0.45" filter="url(#starGlow)">
    <!-- Major Metropolis Clusters -->
    <circle cx="580" cy="980" r="2.5" />
    <circle cx="590" cy="985" r="1.8" />
    <circle cx="610" cy="975" r="2.2" />
    <circle cx="625" cy="990" r="1.5" />
    <circle cx="600" cy="1000" r="2.8" />
    <circle cx="635" cy="1010" r="1.8" />

    <circle cx="880" cy="940" r="2.6" />
    <circle cx="895" cy="935" r="2" />
    <circle cx="915" cy="945" r="3" />
    <circle cx="930" cy="955" r="2.2" />
    <circle cx="905" cy="960" r="1.8" />
    <circle cx="945" cy="940" r="2" />
    <circle cx="960" cy="960" r="2.5" />

    <circle cx="1220" cy="970" r="3.2" />
    <circle cx="1240" cy="965" r="2.4" />
    <circle cx="1260" cy="980" r="2.8" />
    <circle cx="1280" cy="995" r="1.9" />
    <circle cx="1235" cy="990" r="2.1" />

    <circle cx="1420" cy="1020" r="2.8" />
    <circle cx="1445" cy="1015" r="2.2" />
    <circle cx="1460" cy="1030" r="1.9" />
  </g>

  <!-- High-Tech Orbital Coordinate Grid Overlays -->
  <g stroke="#00E5FF" stroke-width="0.5" stroke-opacity="0.1">
    <circle cx="960" cy="540" r="480" fill="none" stroke-dasharray="4 6" />
    <circle cx="960" cy="540" r="720" fill="none" stroke-dasharray="6 8" />
    <line x1="960" y1="40" x2="960" y2="1040" stroke-dasharray="4 8" />
    <line x1="60" y1="540" x2="1860" y2="540" stroke-dasharray="4 8" />
  </g>
</svg>
